[tox]
env_list =
    lint
    type
    py311
    catalog-pg

[testenv]
description = Run unit tests
skip_install = true
allowlist_externals = uv
commands =
    uv sync --active
    uv run --active pytest {posargs:tests}

[testenv:lint]
description = Run ruff for linting and formatting checks
skip_install = true
allowlist_externals = uv
commands =
    uv run --active ruff check src tests ext
    uv run --active ruff format --check src tests ext

[testenv:type]
description = Run mypy for static type checking
skip_install = true
allowlist_externals = uv
commands =
    uv sync --active
    uv run --active mypy --no-incremental src

[testenv:catalog-pg]
description = Check packaged spinor class tables against QTen lift and spgrep
skip_install = true
allowlist_externals = uv
commands =
    uv sync --active
    uv run --active python scripts/retrieve_pointgroup_catalog.py --check-spgrep
