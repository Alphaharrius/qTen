[tox]
env_list =
    lint
    type
    py311
    double-pg

[testenv]
description = Run unit tests
skip_install = true
allowlist_externals = uv
commands =
    uv sync --active --extra cpu
    uv run --active pytest {posargs:tests}

[testenv:lint]
description = Run ruff for linting and formatting checks
skip_install = true
allowlist_externals = uv
commands =
    uv run --active ruff check src tests ext
    uv run --active ruff format --check src tests ext

[testenv:type]
description = Run mypy for static type checking
skip_install = true
allowlist_externals = uv
commands =
    uv sync --active --extra cpu
    uv run --active mypy --no-incremental src

[testenv:double-pg]
description = Check packaged double-point-group cache against regeneration
skip_install = true
allowlist_externals = uv
commands =
    uv sync --active --extra cpu
    uv run --active python scripts/retrieve_double_pointgroup_data.py --check
